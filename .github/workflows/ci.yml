name: ci
on: [push, pull_request]

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -e 'shared[dev]' -e 'backend[dev]' -e 'prediction[dev]'
      - run: ruff check shared backend prediction scripts
      - run: cd shared && pytest -q
      - run: cd backend && pytest -q
      - run: cd prediction && pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: frontend}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: "22", cache: npm, cache-dependency-path: frontend/package-lock.json}
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  compose-smoke:
    runs-on: ubuntu-latest
    needs: [python, frontend]
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - run: docker compose build
      - run: docker compose up -d --wait --wait-timeout 300
      - run: python3 scripts/e2e.py --ticks 50 --min-service-level 0.99
      - if: failure()
        run: docker compose logs --tail 200
      - if: always()
        run: docker compose down -v
