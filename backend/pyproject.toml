[project]
name = "bupfuel-backend"
version = "1.0.0"
description = "Fuel supply operations platform backend: sync, decision engine, approvals, dashboard API"
requires-python = ">=3.12"
# Also needs the local shared package: pip install ./shared (distribution "bupfuel-core", import "fuelcore").
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "httpx>=0.27",
  "httpx-sse>=0.4",
  "tenacity>=8.5",
  "sqlalchemy[asyncio]>=2.0.30",
  "asyncpg>=0.29",
  "prometheus-client>=0.20",
  "prometheus-fastapi-instrumentator>=7.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "respx>=0.21", "ruff>=0.6", "aiosqlite>=0.20"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app", "app.sim"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
